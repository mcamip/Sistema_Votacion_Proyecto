name: CI/CD Pipeline - Sistema de Votación

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Copiar repositorio en el servidor de pruebas
      uses: actions/checkout@v4

    - name: Configurar entorno de Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Instalar dependencias del proyecto
      run: |
        python -m pip install --upgrade pip
        pip install pytest sqlalchemy pymysql

    - name: Ejecutar pruebas de integración con Pytest
      run: |
        python -m pytest tests/ -v
        